[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-fantasy-football"
version = "0.1.0"
description = "NFL fantasy-football projections, draft support, and season tracking"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=16",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nfl-fantasy = "nfl_fantasy_football.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
